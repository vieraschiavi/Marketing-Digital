# Instalador de Windows (NSIS) de MV Marketing Digital.
# Solo en tags v* o a mano: los runners de Windows cuestan el doble de minutos.
# En un tag, adjunta el .exe al Release con nombre estable
# (MV-Marketing-Digital-Setup.exe) para que la web enlace a
# releases/latest/download/MV-Marketing-Digital-Setup.exe.
name: Instalador Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm ci --prefix desktop
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run lint
      - run: npm test

  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Versión del tag → package.json del escritorio
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Dependencias
        working-directory: desktop
        run: npm ci
      - name: Armar instalador (NSIS x64)
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MV-Marketing-Digital-Windows
          path: desktop/release/*.exe
          retention-days: 90
      - name: Publicar en el Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/MV-Marketing-Digital-Setup.exe
          generate_release_notes: true
